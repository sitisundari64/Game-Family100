    :root {

    .round-tab.is-active {

    .answer-tile {
      min-height: 62px;
      transition: transform .18s ease, box-shadow .18s ease, background .25s ease;
    }

    .answer-tile:hover:not(:disabled) {
      transform: translateX(4px);
      box-shadow: 0 8px 18px rgba(8, 47, 73, .12);
    }

    .answer-tile.is-open {
      background: #fff7d6;
      border-color: #fbbf24;
      cursor: default;
    }

    .answer-tile.is-open .answer-cover { display: none; }
    .answer-tile.is-open .answer-reveal { display: flex; }

    .answer-reveal { display: none; }

    .answer-tile.is-open .answer-index {
      background: #fbbf24;

    }

    .score-pop { animation: pop .3s ease both; }

    .feedback-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: rgba(8, 47, 73, .58);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .feedback-overlay.is-visible { opacity: 1; }

    .feedback-mark {
      display: grid;
      place-items: center;
      width: min(42vw, 210px);
      height: min(42vw, 210px);
      border: 10px solid #fff;
      border-radius: 999px;
      color: white;
      box-shadow: 0 18px 50px rgba(8, 47, 73, .45);
      animation: feedback-pop .45s cubic-bezier(.2,.8,.2,1) both;
    }

    .feedback-mark svg {
      width: 62%;
      height: 62%;
      stroke-width: 3.5;
    }

    .feedback-mark.correct {
      background: #16a34a;
      border-color: #bbf7d0;
    }

    .feedback-mark.wrong {
      background: #dc2626;
      border-color: #fecaca;
    }

    .round-panel { display: none; animation: rise .35s ease both; }
    .round-panel.is-active { display: block; }

    .round-tab:focus-visible,
    .answer-tile:focus-visible,
    .action-button:focus-visible {

    @keyframes feedback-pop {
      0% { transform: scale(.35) rotate(-12deg); opacity: 0; }

    @keyframes rise {

    @keyframes pop {

    @media (max-width: 640px) {

  <script>
    const rounds = [
      {
        question: "Sebutkan makanan yang sering ada saat sarapan di rumah Indonesia!",
        answers: [["Nasi goreng", 35], ["Roti", 25], ["Bubur ayam", 18], ["Mie instan", 12], ["Nasi uduk", 10]]
      },
      {
        question: "Sebutkan barang yang biasanya dibawa saat bepergian!",
        answers: [["Dompet", 32], ["Ponsel", 24], ["Kunci", 20], ["Tas", 14], ["Botol minum", 10]]
      },
      {
        question: "Sebutkan hal yang dilakukan orang sebelum tidur!",
        answers: [["Sikat gigi", 30], ["Berdoa", 25], ["Main ponsel", 20], ["Cuci muka", 15], ["Ganti baju tidur", 10]]
      },
      {
        question: "Sebutkan buah yang paling sering dijadikan jus!",
        answers: [["Jeruk", 34], ["Mangga", 24], ["Alpukat", 18], ["Melon", 14], ["Semangka", 10]]
      },
      {
        question: "Sebutkan alasan anak-anak senang pergi ke mal!",
        answers: [["Main di arena permainan", 28], ["Makan di restoran", 25], ["Nonton bioskop", 20], ["Beli mainan", 15], ["Jalan-jalan", 12]]
      },
      {
        question: "Sebutkan benda yang ada di dapur!",
        answers: [["Kompor", 30], ["Piring", 25], ["Panci", 20], ["Kulkas", 15], ["Sendok", 10]]
      },
      {
        question: "Sebutkan pekerjaan rumah yang sering dilakukan anak!",
        answers: [["Merapikan tempat tidur", 30], ["Mencuci piring", 25], ["Menyapu", 20], ["Membuang sampah", 15], ["Melipat baju", 10]]
      },
      {
        question: "Sebutkan hal yang dilakukan saat listrik mati!",
        answers: [["Mencari senter", 32], ["Menyalakan lilin", 25], ["Keluar rumah", 18], ["Memeriksa meteran listrik", 15], ["Menunggu listrik menyala", 10]]
      },
      {
        question: "Sebutkan sesuatu yang biasa dibeli di warung!",
        answers: [["Mie instan", 30], ["Minuman", 25], ["Jajanan", 20], ["Rokok", 15], ["Sembako", 10]]
      },
      {
        question: "Sebutkan kegiatan favorit keluarga saat akhir pekan!",
        answers: [["Nonton bersama", 30], ["Jalan-jalan", 25], ["Makan bersama", 20], ["Berkunjung ke rumah saudara", 15], ["Olahraga", 10]]
      }
    ];

    let totalScore = 0;
    let activeRound = 1;

    const nav = document.getElementById("round-nav");
    const roundsContainer = document.getElementById("rounds-container");
    const scoreOutput = document.getElementById("total-score");

    function renderGame() {
      rounds.forEach((round, index) => {
        const number = index + 1;

        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = "round-tab rounded-xl bg-white/15 px-3 py-3 text-sm font-extrabold text-white";
        tab.dataset.round = number;
        tab.setAttribute("aria-label", "Buka ronde " + number);
        tab.textContent = String(number).padStart(2, "0");
        nav.appendChild(tab);

        const panel = document.createElement("article");
        panel.className = "round-panel";
        panel.dataset.round = number;

        panel.innerHTML = `
          <div class="game-card overflow-hidden rounded-[1.75rem] bg-white">
            <div class="bg-sky-900 px-6 py-6 text-white sm:px-8">
              <span class="inline-flex rounded-full bg-yellow-400 px-3 py-1 text-xs font-extrabold uppercase tracking-wider text-sky-950">
                Ronde ${String(number).padStart(2, "0")}
              </span>
              <h2 class="mt-3 text-2xl font-extrabold leading-tight sm:text-3xl">${round.question}</h2>
            </div>
            <div class="space-y-3 p-5 sm:p-7">
              ${round.answers.map((answer, answerIndex) => `
                <button type="button" class="answer-tile w-full rounded-2xl border-2 border-sky-100 bg-slate-50 p-3 text-left" data-points="${answer[1]}" aria-pressed="false">
                  <span class="answer-cover flex items-center gap-3">
                    <span class="answer-index flex h-9 w-9 items-center justify-center rounded-xl bg-sky-900 text-sm font-extrabold text-white">${answerIndex + 1}</span>
                    <span class="text-sm font-bold text-slate-500">Klik untuk membuka jawaban</span>
                  </span>
                  <span class="answer-reveal items-center justify-between gap-4">
                    <span class="text-base font-bold text-sky-950 sm:text-lg">${answer[0]}</span>
                    <strong class="rounded-xl bg-sky-900 px-3 py-1 text-sm font-extrabold text-white">${answer[1]}</strong>
                  </span>
                </button>
              `).join("")}
            </div>
          </div>
        `;

        roundsContainer.appendChild(panel);
      });

      bindAnswerTiles();
      showRound(1);
    }

    function showRound(roundNumber) {
      activeRound = Number(roundNumber);

      document.querySelectorAll(".round-panel").forEach(panel => {
        panel.classList.toggle("is-active", Number(panel.dataset.round) === activeRound);
      });

      document.querySelectorAll(".round-tab").forEach(tab => {
        const isActive = Number(tab.dataset.round) === activeRound;
        tab.classList.toggle("is-active", isActive);
        tab.setAttribute("aria-current", isActive ? "true" : "false");
      });
    }

    function updateScore() {
      scoreOutput.textContent = totalScore;
      scoreOutput.classList.remove("score-pop");
      void scoreOutput.offsetWidth;
      scoreOutput.classList.add("score-pop");
    }

    function playCorrectSound() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      const audioContext = new AudioContextClass();
      const now = audioContext.currentTime;

      [523.25, 659.25, 783.99].forEach((frequency, index) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(frequency, now + index * 0.09);
        gain.gain.setValueAtTime(0.001, now + index * 0.09);
        gain.gain.exponentialRampToValueAtTime(0.16, now + index * 0.09 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.09 + 0.28);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(now + index * 0.09);
        oscillator.stop(now + index * 0.09 + 0.3);
      });

      window.setTimeout(() => audioContext.close(), 650);
    }

    function playWrongSound() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      const audioContext = new AudioContextClass();
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "square";
      oscillator.frequency.setValueAtTime(180, audioContext.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(90, audioContext.currentTime + 0.22);
      gain.gain.setValueAtTime(0.12, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.22);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.22);
      oscillator.addEventListener("ended", () => audioContext.close(), { once: true });
    }

    function showFeedback(type) {
      const overlay = document.getElementById(type === "correct" ? "correct-overlay" : "wrong-overlay");

      overlay.classList.remove("is-visible");
      void overlay.offsetWidth;
      overlay.classList.add("is-visible");
      overlay.setAttribute("aria-hidden", "false");

      window.setTimeout(() => {
        overlay.classList.remove("is-visible");
        overlay.setAttribute("aria-hidden", "true");
      }, 850);
    }

    function bindAnswerTiles() {
      document.querySelectorAll(".answer-tile").forEach(tile => {
        tile.addEventListener("click", () => {
          if (tile.classList.contains("is-open")) return;

          tile.classList.add("is-open");
          tile.disabled = true;
          tile.setAttribute("aria-pressed", "true");

          totalScore += Number(tile.dataset.points);
          updateScore();
          showFeedback("correct");
          playCorrectSound();
        });
      });
    }

    function resetRound() {
      const activePanel = document.querySelector('.round-panel[data-round="' + activeRound + '"]');
      let removedPoints = 0;

      activePanel.querySelectorAll(".answer-tile.is-open").forEach(tile => {
        removedPoints += Number(tile.dataset.points);
        tile.classList.remove("is-open");
        tile.disabled = false;
        tile.setAttribute("aria-pressed", "false");
      });

      totalScore = Math.max(0, totalScore - removedPoints);
      updateScore();
    }

    nav.addEventListener("click", event => {
      const tab = event.target.closest(".round-tab");
      if (tab) showRound(tab.dataset.round);
    });

    document.getElementById("wrong-answer").addEventListener("click", () => {
      showFeedback("wrong");
      playWrongSound();
    });

    document.getElementById("reset-round").addEventListener("click", resetRound);

    document.getElementById("reset-all").addEventListener("click", () => {
      document.querySelectorAll(".answer-tile").forEach(tile => {
        tile.classList.remove("is-open");
        tile.disabled = false;
        tile.setAttribute("aria-pressed", "false");
      });

      totalScore = 0;
      updateScore();
      showRound(1);
    });

    renderGame();
    lucide.createIcons();
  </script>
